name: Actualitza i publica

# Cada hora (al minut 17) mentre duri la campanya de les generals del
# 29/11/2026, perque cada enquesta nova surti a la web com mes aviat millor.
# Abans era un cop al dia (6:15 UTC); quan acabin les eleccions es pot tornar
# a "15 6 * * *". Tambe es pot llancar a ma des de la pestanya Actions.
on:
  schedule:
    - cron: "17 * * * *"
    # 29/11/2026, 20:01 (19:01 UTC): tanquen els col.legis i s'acaba la veda.
    # La web ha de mostrar de seguida els escons segons la participacio (nit.py).
    - cron: "1 19 29 11 *"
  workflow_dispatch:
    inputs:
      rapid:
        description: "Publicacio rapida (jornada electoral): nomes Espanya, la resta de l'ultima execucio"
        type: boolean
        default: false
      # Jornada del 29N (26/11/2026): l'Alfonso pot posar la xifra oficial de
      # participacio des del mobil, amb l'ordinador apagat. Es desa amb
      # `politbureau nit`, es publica en mode rapid i es guarda al repositori.
      etapa:
        description: "29N: avanc de participacio (cap = no en desis cap)"
        type: choice
        options: [cap, 14h, 18h, final]
        default: cap
      valor:
        description: "29N: participacio oficial de l'Interior, en % (p. ex. 39,87)"
        type: string
        default: ""
      font:
        description: "29N: adreca de la pagina de l'Interior (opcional)"
        type: string
        default: ""
      prova:
        description: "Prova: ho calcula tot, pero no guarda res ni publica la web"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  # write: per guardar al repositori la participacio que es posa a ma (etapa/valor).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Publicacio rapida (23/11/2026, per a la jornada del 29N): un commit amb
    # "[nit]" al missatge (`politbureau nit` desa la participacio oficial) o el
    # boto amb "rapid". Es recupera la base de dades de l'ultima execucio
    # completa i nomes es tornen a llegir les enquestes d'Espanya: ~10 minuts
    # en lloc de ~35.
    env:
      NIT: ${{ contains(github.event.head_commit.message, '[nit]') || github.event.inputs.rapid == 'true' || (github.event.inputs.etapa != '' && github.event.inputs.etapa != 'cap') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Els ZIP del Ministeri i la geometria de l'IGN no canvien mai: baixar-los
      # cada dia seria carregar els seus servidors per res.
      - name: Recupera les descarregues guardades
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/geo
          key: fonts-v1-${{ hashFiles('config/sources.yaml') }}

      - name: Recupera l'estat de l'ultima execucio completa (publicacio rapida)
        if: env.NIT == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/politbureau.db
            data/next_elections.json
            data/resultats
            data/conversa
            data/governs
          key: estat-${{ github.run_id }}
          restore-keys: estat-

      # Sense l'estat guardat, la web sortiria sense les pagines de la resta del
      # mon: millor no publicar res i deixar la versio anterior.
      - name: Comprova que hi ha estat guardat
        if: env.NIT == 'true'
        run: |
          test -f data/politbureau.db || { echo "Sense estat guardat, cal una execucio completa abans"; exit 1; }

      # Participacio posada a ma des del boto (etapa + valor). Es comprova que la
      # xifra es raonable abans de desar-la; si no, no es publica res.
      - name: Desa la participacio oficial (29N)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.etapa != 'cap' && github.event.inputs.etapa != ''
        env:
          ETAPA: ${{ github.event.inputs.etapa }}
          VALOR: ${{ github.event.inputs.valor }}
          FONT: ${{ github.event.inputs.font }}
        run: |
          export PYTHONPATH=src
          python - <<'PY'
          import os, sys
          lim = {"14h": (30, 50), "18h": (42, 66), "final": (55, 85)}[os.environ["ETAPA"]]
          try:
              v = float(os.environ["VALOR"].replace(",", ".").replace("%", "").strip())
          except ValueError:
              sys.exit("Valor de participacio no valid: " + os.environ["VALOR"])
          if not lim[0] <= v <= lim[1]:
              sys.exit(f"{v} % no te sentit a les {os.environ['ETAPA']} (ha d'estar entre {lim[0]} i {lim[1]}).")
          PY
          python -m politbureau nit "$ETAPA" "$VALOR" --font "${FONT:-Ministerio del Interior}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/nit-29n.json
          git commit -m "Participacio del 29N: $ETAPA, $VALOR % (posada a ma)" -m "Font: ${FONT:-Ministerio del Interior}"
          echo "Participacio desada:"; python -c "import json;d=json.load(open('config/nit-29n.json',encoding='utf-8'));print(d['stages'], d['projection']['mid'])"
          if [ "${{ github.event.inputs.prova }}" = "true" ]; then echo "Prova: no es guarda res al repositori"; exit 0; fi
          # Si no es pot guardar al repositori, la web es publica igualment amb la xifra.
          git push -q origin HEAD:main || { git fetch -q --depth=50 origin main && git rebase -q origin/main && git push -q origin HEAD:main; }             || echo "::warning::No s'ha pogut guardar config/nit-29n.json al repositori: la web es publica igualment"

      - name: Prepara
        run: |
          export PYTHONPATH=src
          python -m politbureau init
          # El mapa de politbureau.es es nomes Espanya: aqui no es baixen les
          # geometries de Franca, Italia i els EUA (50 MB). De Franca i Italia
          # nomes es publiquen les enquestes (pas de mes avall).
          python -m politbureau geo --only ES

      - name: Llegeix les enquestes noves
        run: |
          export PYTHONPATH=src
          python -m politbureau ingest --country ES

      # Franca, Italia i resta d'Europa (des del 03/11/2026): nomes la mitjana, sense
      # mapa. SUB (06/11/2026): eleccions regionals i municipals de tots els paisos.
      # mapa. La mitjana la fa el `build --country ES` de sota (aggregate_all
      # agafa totes les enquestes de la base). Si Wikipedia falla, la web es
      # publica igual sense aquestes pagines.
      - name: Enquestes de la resta d'Europa i del mon
        if: env.NIT != 'true'
        continue-on-error: true
        run: |
          export PYTHONPATH=src
          python -m politbureau ingest --country FR IT EUROPA MON SUB
          # Properes eleccions de tots els paisos (globus): una sola pagina.
          python -m politbureau calendari

      # Valoracio dels lideres (08/11/2026): aprovacio, nota i preferit per governar.
      # Si falla, les pagines surten igual, sense aquest apartat.
      - name: Valoracio dels lideres
        if: env.NIT != 'true'
        continue-on-error: true
        run: |
          export PYTHONPATH=src
          python -m politbureau liders

      # Resultats recents i composicio dels parlaments (09/11/2026). Si falla, es
      # fa servir la copia de data/resultats/darreres.json del repositori.
      - name: Resultats recents i parlaments
        if: env.NIT != 'true'
        continue-on-error: true
        run: |
          export PYTHONPATH=src
          python -m politbureau resultats

      # Termometre de conversa (20/11/2026): Viquipedia i Bluesky. Si falla, es
      # fa servir la copia de data/conversa/conversa.json del repositori.
      - name: Termometre de conversa
        if: env.NIT != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PYTHONPATH=src
          python -m politbureau conversa

      # Qui governa el mon (21/11/2026). Si falla, es fa servir la copia del repositori.
      - name: Caps de govern
        continue-on-error: true
        timeout-minutes: 5
        run: |
          export PYTHONPATH=src
          python -m politbureau governs

      - name: Recalcula i genera el lloc
        run: |
          export PYTHONPATH=src
          python -m politbureau build --country ES
          python -m politbureau site

      # Estat per a la publicacio rapida: dues vegades al dia (5 h i 17 h UTC) i
      # quan es llanca a ma. Cada copia pesa uns 250 MB; cada hora ompliria la
      # memoria cau del repositori (10 GB) i en faria fora les descarregues.
      - name: Hora
        id: hora
        run: echo "h=$(date -u +%H)" >> "$GITHUB_OUTPUT"

      - name: Guarda l'estat per a la publicacio rapida
        if: env.NIT != 'true' && (steps.hora.outputs.h == '05' || steps.hora.outputs.h == '17' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            data/politbureau.db
            data/next_elections.json
            data/resultats
            data/conversa
            data/governs
          key: estat-${{ github.run_id }}

      # Si el lloc te enllacos trencats, titols duplicats o adreces al sitemap
      # que no existeixen, NO es publica. Val mes deixar en linia la versio
      # d'ahir que substituir-la per una de trencada.
      - name: Revisa abans de publicar
        run: |
          export PYTHONPATH=src
          python -m politbureau check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event.inputs.prova != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # La web ja passa dels 20.000 fitxers: amb els 10 minuts per defecte
          # la copia de GitHub Pages no acabava (10/11/2026).
          timeout: 1800000
