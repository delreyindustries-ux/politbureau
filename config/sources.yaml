# Fonts d'enquestes. Cada entrada és una pàgina de Wikipedia amb taules d'enquestes.
# L'ingestor tolera pàgines inexistents: les registra com a "skipped" i continua.
# Afegir-ne una de nova = afegir una línia aquí. No cal tocar codi.

wikipedia_api: "https://en.wikipedia.org/w/api.php"

elections:

  # ---------- ESPANYA ----------
  - id: es-general
    country: ES
    label: "Espanya — Generals (Congrés)"
    scope: national
    page: "Opinion_polling_for_the_2026_Spanish_general_election"
    baseline: {election: "congreso-2023", date: "2023-07-23"}
    election_date: "2026-11-29"
    # Veda de la LOREG (art. 69.7): del 24/11 fins que tanquen els col.legis el
    # 29/11 a les 20 h no entra cap enquesta nova; despres, nomes els sondeigs a
    # peu d'urna. Decisio de l'Alfonso, 05/10/2026. Vegeu src/politbureau/veda.py.
    veda: {from: "2026-11-24T00:00:00+01:00", to: "2026-11-29T20:00:00+01:00"}
    chamber:
      name: "Congreso de los Diputados"
      seats: 350
      method: dhondt_province      # llei d'Hondt a cadascuna de les 52 circumscripcions
    # Partits que les cases d'enquestes pregunten pero que NO es presenten a
    # aquesta eleccio. Es treuen de la mitjana i de la projeccio; dins de cada
    # territori la resta es reparteix el seu pes proporcionalment, que en
    # percentatges es el mateix que comptar-los com a abstencio.
    #   ALIANCA: Silvia Orriols ha dit que no es presentara a les generals ("no
    #   som espanyols") i vol prohibir-ho als estatuts. Si que es presenta a les
    #   catalanes i a les municipals, per aixo la regla va per eleccio i no al
    #   cataleg de partits. Font: infoLibre i El Español, consultats el 03/10/2026.
    #   CUP: no es presenta a les generals del 29/11/2026 (decisio de l'Alfonso,
    #   12/10/2026). Com que no surt a les enquestes estatals, el model el
    #   mantenia congelat al seu resultat del 2023 a Catalunya; ara es treu
    #   tambe de la projeccio (build.py) i el seu vot es reparteix com abstencio.
    not_standing: [ALIANCA, CUP, UPL]   # UPL: no es presenta a Lleó (14/10/2026)
    # Pes editorial per casa (decisió de l'Alfonso, 14/10/2026): les enquestes
    # del CIS compten 10 vegades més. Només "CIS": no les reestimacions
    # d'altres cases amb dades del CIS ("CIS (Target Point)"...).
    pollster_weights: {CIS: 10}
    # Sondeigs interns de partits que Wikipedia posa amb el nom del mitja que
    # els publica (si l'"institut" es el mateix partit, ja els treu
    # is_party_poll). Coincidencia exacta de casa + data de fi del camp.
    #   The Objective 27/10: sondeig intern de Vox (The Objective, 01/11/2026).
    party_polls: [{pollster: "The Objective", fieldwork_end: "2026-10-27"}]
    # Partits que a aquesta eleccio van DINS d'un altre. Es sumen enquesta per
    # enquesta abans de fer la mitjana. Nomes aqui: a les autonomiques i les
    # municipals es presenten sols.
    #   MESPM: Mes per Mallorca i Mes per Menorca. El 2023 la llista balear al
    #   Congres ja es deia "MES PER MALLORCA-MES PER MENORCA-SUMAR" (fitxer 03 del
    #   Ministeri), i l'Alfonso confirma que hi tornaria a anar (03/10/2026).
    #   MASMADRID, COMUNS: socis del Frente Amplio, la marca de Sumar per al 2027.
    #   CHA: Chunta Aragonesista, que el 2023 ja va anar dins de la llista de
    #   Sumar a l'Arago; l'Alfonso confirma que hi tornaria (03/10/2026).
    #   PODEMOS: del 07/10 al 13/10/2026 es va comptar dins del Frente Amplio;
    #   des del 13/10 (decisio de l'Alfonso) torna a anar per separat.
    # "?FA": columna "FA" (Frente Amplio) d'algunes cases des del 14/10/2026.
    # No es un alies del cataleg perque "FA" tambe es una llista municipal.
    # "?FV": Compromis-Front Valencia quan una casa el posa com a "FV"
    # (SocioMetrica, 27/10/2026); "FV-ERC-AM" o "FV - C" son llistes municipals.
    merge: {MESPM: SUMAR, MASMADRID: SUMAR, COMUNS: SUMAR, CHA: SUMAR, RECORTESCERO: SUMAR,
            "?FA": SUMAR, "?FV": SUMAR}
    # Partits que a AQUESTA eleccio no es presenten en algunes comunitats (codi
    # INE). A diferencia de _scope (parties.yaml), val nomes per a aquesta eleccio.
    #   PODEMOS: no es presenta a Catalunya (09) a les generals del 29/11/2026
    #   (decisio de l'Alfonso, 13/10/2026). El seu vot de les enquestes estatals
    #   es concentra a la resta d'Espanya (build.scope_concentration).
    scope_exclude: {PODEMOS: ["09"]}
    # A les generals del 2026 el codi SUMAR es presenta com a Frente Amplio
    # (parties.meta amb l'eleccio). El 2023 i les altres eleccions: Sumar.
    display: {SUMAR: "Frente Amplio"}
    # A Canaries (05) la llista unica va amb Nueva Canarias (acord del 15/10/2026).
    # Noms de les coalicions registrades el 15-16/10/2026, nomes a la seva comunitat:
    #   05 Canaries: Podemos + NC-BC + IU + Sumar = "Unidad del Pueblo Canario"
    #   04 Balears:  Ara Mes + Sumar + EU + Recortes Cero = "Ara Mes-Front Ampli";
    #      Podemos s'hi suma el 25/10/2026 (Lucia Munoz, n. 3, com a independent)
    #   02 Arago:    CHA + IU + Sumar + PV + Recortes Cero (sense Podemos)
    #   10 Pais Valencia: Compromis + Podem + EUPV + ERPV = "Compromís-Front Valencià"
    #      (EUPV hi entra a ultima hora, 16/10/2026)
    #   15 Navarra: "Unión del Pueblo Navarro en coalición con el Partido Popular"
    #   01 Andalusia: IU + Sumar + Iniciativa del Pueblo Andaluz + Verdes Equo (sense
    #      Podemos; Adelante Andalucia, a part). Resta: "Frente Amplio" (17/10/2026)
    #   05 Canaries: CC + Primero Canarias (+ CCD), acord del 17/10/2026. A Santa
    #      Cruz de Tenerife «Coalición Canaria-Primero Canarias»; a Las Palmas
    #      «Primero Canarias-Coalición Canaria». Drago Canarias va sol (sense
    #      enquestes: el model no l'estima).
    regional_display:
      "05": {SUMAR: "Unidad del Pueblo Canario", CC: "Coalición Canaria-Primero Canarias"}
      "04": {SUMAR: "Ara MÉS-Front Ampli"}
      "01": {SUMAR: "Frente Amplio por Andalucía"}
      "02": {SUMAR: "Chunta Aragonesista-Frente Amplio Aragón"}
      "10": {SUMAR: "Compromís-Front Valencià"}
      "15": {PP: "UPN-PP"}
    # Diputats per circumscripcio al 29/11/2026, quan no son els del 2023. Font:
    # Reial decret 806/2026, de 5 d'octubre (BOE-A-2026-20742), annex: Madrid
    # passa de 37 a 38 i Cadis de 9 a 8; la resta, igual. Total: 350.
    magnitudes: {"28": 38, "11": 8}
    # Llistes uniques per comunitat: alla, TOTS els partits a l'esquerra del PSOE
    # (posicio < PSOE a parties.yaml) van en una sola candidatura, que el model
    # compta amb el codi `into`. Els vots se SUMEN (retencio 100 %). Es fa a cada
    # territori despres de la projeccio, perque les enquestes son estatals.
    #   Des del 07/10 Podemos ja va dins del Frente Amplio a tot Espanya; aqui
    #   la regla encara hi suma Nueva Canarias.
    #   05 Canarias: Podemos, Sumar i Nueva Canarias (NC negocia una llista
    #      unica "amb marca canaria").  02 Arago: Podemos i Sumar (amb CHA, que
    #      la vol encapcalar).  10 Comunitat Valenciana: Podemos i Sumar (amb
    #      Compromis). Decisio de l'Alfonso, 06/10/2026.
    # Correccions del resultat de base (23J) ABANS del swing, per a partits que
    # el 2023 no hi eren o que s'han partit (build.adjust_baseline):
    #   baseline_fill: Vox no es va presentar al Congres per Santa Cruz de
    #     Tenerife el 23J (la llista es va quedar sense prou candidats) i el 29N
    #     si. Se li dona el seu % del nov. 2019 a cada municipi, multiplicat pel
    #     que va creixer a Las Palmas entre el 2019 i el 2023 (14,71 / 13,44).
    #   baseline_split: Primero Canarias, escindit de Nueva Canarias, va amb CC.
    #     La meitat del vot de NC del 2023 passa a CC; l'altra meitat es queda a
    #     NC, que la regla de sota suma a Unidad del Pueblo Canario. Hipotesi de
    #     l'Alfonso (18/10/2026), fins que hi hagi enquestes canaries.
    # Partits que no es presenten en unes provincies i el vot dels quals passa a
    # un altre (retencio del 100 %, el criteri de les llistes uniques). Es fa
    # despres de la projeccio (build.apply_withdraw).
    #   44 Terol: CHA-Frente Amplio Arago no es presenta al Congres per Terol
    #   (Jorge Pueyo, 21/10/2026: "evitar la dispersio del vot"); alla nomes va
    #   al Senat, amb el PSOE ("Senado de Progreso"). Per al Congres no hi ha
    #   pacte formal; el vot al PSOE es decisio de l'Alfonso (21/10/2026).
    withdraw:
      - {party: SUMAR, provinces: ["44"], to: PSOE}
    # Partits sense columna a la taula d'enquestes ni resultat del 23J, amb una
    # xifra publicada: el % estatal es concentra a les provincies on es presenten
    # (build.apply_fixed). Democracia 21 (Cs + UCIN + D21) nomes va a Madrid i
    # Barcelona; El Espanol / SocioMetrica, 25/10/2026: "anclada en el 0,1 %".
    fixed_estimates:
      - {party: D21, share: 0.1, provinces: ["28", "08"]}
    # Partits que el mapa ensenya sempre al desplegable encara que no arribin al
    # 3 % enlloc ni a l'1 % de la mitjana (decisio de l'Alfonso, 26/10/2026).
    map_always: [FO, FE, D21]
    baseline_fill:
      - {party: VOX, provinces: ["38"], from: congreso-2019n, scale_from: "35"}
    baseline_split:
      - {party: NC, regions: ["05"], to: CC, share: 0.5}
    regional_merge:
      # Arago (02) en surt el 16/10/2026: Podemos hi va per separat.
      - {regions: ["05", "10"], into: SUMAR, left_of: PSOE}
      # Navarra (15): UPN i PP van junts (acord del 13/10/2026).
      - {regions: ["15"], into: PP, parties: [UPN]}
      # Recortes Cero va dins del Frente Amplio a tot l'Estat (17/10/2026).
      - {regions: "*", into: SUMAR, parties: [RECORTESCERO]}
      # Balears (04): Podemos entra a Ara Mes-Front Ampli (acord del 25/10/2026).
      - {regions: ["04"], into: SUMAR, parties: [PODEMOS]}

  - id: es-general-sub
    country: ES
    label: "Espanya — Generals per comunitat"
    scope: region
    page: "Sub-national_opinion_polling_for_the_next_Spanish_general_election"
    baseline: {election: "congreso-2023", date: "2023-07-23"}
    # Les mateixes regles que a es-general: Frente Amplio = Sumar + Podemos + socis.
    not_standing: [ALIANCA, CUP, UPL]   # UPL: no es presenta a Lleó (14/10/2026)
    # Pes editorial per casa (decisió de l'Alfonso, 14/10/2026): les enquestes
    # del CIS compten 10 vegades més. Només "CIS": no les reestimacions
    # d'altres cases amb dades del CIS ("CIS (Target Point)"...).
    pollster_weights: {CIS: 10}
    # "?FA": columna "FA" (Frente Amplio) d'algunes cases des del 14/10/2026.
    # No es un alies del cataleg perque "FA" tambe es una llista municipal.
    # "?FV": Compromis-Front Valencia quan una casa el posa com a "FV"
    # (SocioMetrica, 27/10/2026); "FV-ERC-AM" o "FV - C" son llistes municipals.
    merge: {MESPM: SUMAR, MASMADRID: SUMAR, COMUNS: SUMAR, CHA: SUMAR, RECORTESCERO: SUMAR,
            "?FA": SUMAR, "?FV": SUMAR}
    scope_exclude: {PODEMOS: ["09"]}
    display: {SUMAR: "Frente Amplio"}
    # A Canaries (05) la llista unica va amb Nueva Canarias (acord del 15/10/2026).
    # Noms de les coalicions registrades el 15-16/10/2026, nomes a la seva comunitat:
    #   05 Canaries: Podemos + NC-BC + IU + Sumar = "Unidad del Pueblo Canario"
    #   04 Balears:  Ara Mes + Sumar + EU + Recortes Cero = "Ara Mes-Front Ampli";
