# Fonts d'enquestes. Cada entrada és una pàgina de Wikipedia amb taules d'enquestes.
# L'ingestor tolera pàgines inexistents: les registra com a "skipped" i continua.
# Afegir-ne una de nova = afegir una línia aquí. No cal tocar codi.

wikipedia_api: "https://en.wikipedia.org/w/api.php"

elections:

  # ---------- ESPANYA ----------
  - id: es-general
    country: ES
    label: "Espanya — Generals (Congrés)"
    scope: national
    page: "Opinion_polling_for_the_next_Spanish_general_election"
    baseline: {election: "congreso-2023", date: "2023-07-23"}
    chamber:
      name: "Congreso de los Diputados"
      seats: 350
      method: dhondt_province      # llei d'Hondt a cadascuna de les 52 circumscripcions
    # Partits que les cases d'enquestes pregunten pero que NO es presenten a
    # aquesta eleccio. Es treuen de la mitjana i de la projeccio; dins de cada
    # territori la resta es reparteix el seu pes proporcionalment, que en
    # percentatges es el mateix que comptar-los com a abstencio.
    #   ALIANCA: Silvia Orriols ha dit que no es presentara a les generals ("no
    #   som espanyols") i vol prohibir-ho als estatuts. Si que es presenta a les
    #   catalanes i a les municipals, per aixo la regla va per eleccio i no al
    #   cataleg de partits. Font: infoLibre i El Español, consultats el 03/10/2026.
    not_standing: [ALIANCA]
    # Partits que a aquesta eleccio van DINS d'un altre. Es sumen enquesta per
    # enquesta abans de fer la mitjana. Nomes aqui: a les autonomiques i les
    # municipals es presenten sols.
    #   MESPM: Mes per Mallorca i Mes per Menorca. El 2023 la llista balear al
    #   Congres ja es deia "MES PER MALLORCA-MES PER MENORCA-SUMAR" (fitxer 03 del
    #   Ministeri), i l'Alfonso confirma que hi tornaria a anar (03/10/2026).
    #   MASMADRID, COMUNS: socis del Frente Amplio, la marca de Sumar per al 2027.
    #   CHA: Chunta Aragonesista, que el 2023 ja va anar dins de la llista de
    #   Sumar a l'Arago; l'Alfonso confirma que hi tornaria (03/10/2026).
    merge: {MESPM: SUMAR, MASMADRID: SUMAR, COMUNS: SUMAR, CHA: SUMAR}

  - id: es-general-sub
    country: ES
    label: "Espanya — Generals per comunitat"
    scope: region
    page: "Sub-national_opinion_polling_for_the_next_Spanish_general_election"
    baseline: {election: "congreso-2023", date: "2023-07-23"}

  - id: es-local-2027
    country: ES
    label: "Espanya — Municipals 2027"
    scope: national
    page: "Opinion_polling_for_the_2027_Spanish_local_elections"
    baseline: {election: "municipales-2023", date: "2023-05-28"}
    regional_pages:
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Andalusia)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Aragon)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Basque_Country)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Canary_Islands)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Catalonia)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Extremadura)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Galicia)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Community_of_Madrid)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Region_of_Murcia)"
      - "Opinion_polling_for_the_2027_Spanish_local_elections_(Valencian_Community)"

  - id: es-euro
    country: ES
    label: "Espanya — Europees"
    scope: national
    page: "Opinion_polling_for_the_next_European_Parliament_election_in_Spain"
    baseline: {election: "europeas-2024", date: "2024-06-09"}
    seat_method: dhondt
    seat_level: national
    optional: true


  # ======================================================================
  # FORA D'ESPANYA — nomes eina local (pb.ps1 serve), NO a politbureau.es.
  # La publicacio fa `--country ES` i aquestes entrades no hi entren.
  # Restaurades el 02/10/2026 a peticio de l'Alfonso.
  # ======================================================================

  # ---------- FRANÇA ----------
  - id: fr-pres-2027
    country: FR
    label: "França — Presidencials 2027 (1a volta)"
    scope: national
    page: "Opinion_polling_for_the_2027_French_presidential_election"
    # Es vota una persona: el mapa i el resum mostren el CANDIDAT, no el partit.
    # Els de l'estimacio surten de les enquestes (el mes preguntat de cada linia
    # als ultims 90 dies); els del 2022, del fitxer oficial de resultats.
    display: candidates
    baseline:
      election: "presidentielle-2022-t1"
      date: "2022-04-10"
      candidates:
        ENS: "Emmanuel Macron"
        RN: "Marine Le Pen"
        LFI: "Jean-Luc Mélenchon"
        REC: "Éric Zemmour"
        LR: "Valérie Pécresse"
        EELV: "Yannick Jadot"
        PCF: "Fabien Roussel"
        PS: "Anne Hidalgo"
        OTHER: "Altres candidats"   # Lassalle, Dupont-Aignan, Poutou i Arthaud

  # ---------- ITÀLIA ----------
  - id: it-general
    country: IT
    label: "Itàlia — Generals (Camera)"
    scope: national
    page: "Opinion_polling_for_the_next_Italian_general_election"
    baseline: {election: "politiche-2022", date: "2022-09-25"}
    chamber:
      name: "Camera dei Deputati"
      seats: 400
      method: proportional
      # Avis honest: el Rosatellum reparteix un 37% dels escons en districtes
      # uninominals, i aixo no es modela. El grafic dona l'ordre de magnitud,
      # no l'escon exacte, i ho ha de dir a la pantalla.

  # ---------- ESTATS UNITS: midterms 2026, estat per estat ----------
  # Sense resultat de base: als EUA les enquestes ja son per estat, aixi que el
  # mapa nomes pinta els estats que tenen enquestes. Un estat sense enquestes
  # queda en blanc en lloc de rebre un color inventat.
  - id: us-senate-2026
    country: US
    label: "EUA — Senat 2026 per estat"
    scope: state
    page: "2026_United_States_Senate_elections"
    # El patro original perdia Ohio i Florida: son ELECCIONS ESPECIALS (les
    # dimissions de Vance i Rubio) i la pagina es diu "Senate special election
    # in ...". Comprovat el 02/10/2026: el patro original en trobava 33 de 35.
    discover:
      pattern: "^2026_United_States_Senate_(?:special_)?election_in_(.+)$"
    chamber:
      name: "Senat dels Estats Units"
      seats: 100
      in_play: 35                  # 33 ordinaris (classe 2) + 2 especials (Ohio, Florida)
      method: fptp_state
      partial: true

  - id: us-gov-2026
    country: US
    label: "EUA — Governadors 2026 per estat"
    scope: state
    page: "2026_United_States_gubernatorial_elections"
    # Exclou els vicegovernadors: el patro original els agafava i rascava deu
    # pagines de mes. Queden 39 = 36 estats + 3 territoris.
    discover:
      pattern: "^2026_(?!.*lieutenant)(.+)_gubernatorial_election$"
    optional: true


# ---------- GEOMETRIES ----------
# es-atlas i us-atlas venen ja com a TopoJSON quantitzat i lleuger.
# Italia i Franca nomes es publiquen com a GeoJSON de 36 i 12 MB, aixi que es
# quantitzen a `digits` decimals abans de guardar-los (vegeu geo/simplify.py).
geo:
  ES:
    format: topojson
    url: "https://cdn.jsdelivr.net/npm/es-atlas@0.6.0/es/municipalities.json"
    file: "es.json"
    levels: {municipality: municipalities, province: provinces, region: autonomous_regions}
  # Les tres de sota nomes per a l'eina local; la publicacio fa `geo --only ES`.
  US:
    format: topojson
    url: "https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"
    file: "us.json"
    levels: {state: states}
  IT:
    format: geojson
    file: "it.json"
    digits: 4
    sources:
      municipality:
        url: "https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_municipalities.geojson"
        key: minint_elettorale
        key_slice: -7          # els set ultims digits = provincia + comune
        name: name
      region:
        url: "https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson"
        key: reg_istat_code
        name: reg_name
  FR:
    format: geojson
    file: "fr.json"
    digits: 4
    note: "Nomes metropoli i Corsega: france-geojson no publica els departaments d'ultramar."
    sources:
      municipality:
        url: "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/communes.geojson"
        key: code
        name: nom
      region:
        url: "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/regions.geojson"
        key: code
        name: nom

# ---------- AGREGACIÓ ----------
aggregation:
  half_life_days: 14        # pes = 0.5 ^ (dies_enrere / half_life)
  max_age_days: 90          # descarta enquestes més velles
  min_sample: 300
  sample_weight: sqrt       # pes addicional = sqrt(mostra / 1000)
