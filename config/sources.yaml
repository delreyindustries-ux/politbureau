# ---------- REGIONS (demanat el 03/11/2026) ----------
# Enquestes per regio de les eleccions estrangeres que en tenen a Wikipedia.
# `match`: tros del titol de la seccio de la pagina de l'eleccio; `page`: una
# pagina propia de la regio (Escocia). `geo`: camps de Natural Earth admin-1
# (10m) que fan la regio al globus (web/world.json, geo/world.py).
# Nomes surten les regions amb enquestes dels ultims 90 dies.
regions:
  eu-gb:
    - {key: SCT, name_es: Escocia, name_ca: Escòcia, geo: {adm0_a3: GBR, geonunit: Scotland},
       page: "Opinion polling in Scotland for the next United Kingdom general election"}
    - {key: WLS, name_es: Gales, name_ca: Gal·les, match: "wales", geo: {adm0_a3: GBR, geonunit: Wales}}
    - {key: LDN, name_es: Londres, name_ca: Londres, match: "london", geo: {adm0_a3: GBR, region: Greater London}}
  eu-be:
    # Belgica no te partits estatals: no hi ha mitjana del pais, nomes per regio.
    - {key: VLG, name_es: Flandes, name_ca: Flandes, match: "flanders", geo: {adm0_a3: BEL, region: Flemish}}
    - {key: WAL, name_es: Valonia, name_ca: Valònia, match: "wallonia", geo: {adm0_a3: BEL, region: Walloon}}
    - {key: BRU, name_es: Bruselas, name_ca: Brussel·les, match: "brussels", geo: {adm0_a3: BEL, region: Capital Region}}
  eu-de:
    - {key: BY, unit: "09", name_es: Baviera, name_ca: Baviera, match: "bavaria", geo: {adm0_a3: DEU, name: Bayern}}
    - {key: MV, unit: "13", name_es: Mecklemburgo-Pomerania Occidental, name_ca: Mecklemburg-Pomerània Occidental,
       match: "mecklenburg", geo: {adm0_a3: DEU, name: Mecklenburg-Vorpommern}}
    - {key: NW, unit: "05", name_es: Renania del Norte-Westfalia, name_ca: Rin del Nord-Westfàlia,
       match: "north rhine", geo: {adm0_a3: DEU, name: Nordrhein-Westfalen}}
  w-ca:
    - {key: QC, name_es: Quebec, name_ca: Quebec, match: "quebec", geo: {adm0_a3: CAN, name: Québec}}
    - {key: "ON", name_es: Ontario, name_ca: Ontàrio, match: "ontario", geo: {adm0_a3: CAN, name: Ontario}}
    - {key: MB, name_es: Manitoba, name_ca: Manitoba, match: "manitoba", geo: {adm0_a3: CAN, name: Manitoba}}
    - {key: AB, name_es: Alberta, name_ca: Alberta, match: "alberta", geo: {adm0_a3: CAN, name: Alberta}}
    - {key: BC, name_es: Columbia Británica, name_ca: Colúmbia Britànica, match: "british columbia",
       geo: {adm0_a3: CAN, name: British Columbia}}

# ---------- GEOMETRIES ----------
# es-atlas i us-atlas venen ja com a TopoJSON quantitzat i lleuger.
# Italia i Franca nomes es publiquen com a GeoJSON de 36 i 12 MB, aixi que es
# quantitzen a `digits` decimals abans de guardar-los (vegeu geo/simplify.py).
geo:
  ES:
    format: topojson
    url: "https://cdn.jsdelivr.net/npm/es-atlas@0.6.0/es/municipalities.json"
    file: "es.json"
    levels: {municipality: municipalities, province: provinces, region: autonomous_regions}
  # Les tres de sota nomes per a l'eina local; la publicacio fa `geo --only ES`.
  US:
    format: topojson
    url: "https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"
    file: "us.json"
    levels: {state: states}
  IT:
    format: geojson
    file: "it.json"
    digits: 4
    sources:
      municipality:
        url: "https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_municipalities.geojson"
        key: minint_elettorale
        key_slice: -7          # els set ultims digits = provincia + comune
        name: name
      region:
        url: "https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson"
        key: reg_istat_code
        name: reg_name
  FR:
    format: geojson
    file: "fr.json"
    digits: 4
    note: "Nomes metropoli i Corsega: france-geojson no publica els departaments d'ultramar."
    sources:
      municipality:
        url: "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/communes.geojson"
        key: code
        name: nom
      region:
        url: "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/regions.geojson"
        key: code
        name: nom

# ---------- AGREGACIÓ ----------
aggregation:
  half_life_days: 14        # pes = 0.5 ^ (dies_enrere / half_life)
  max_age_days: 90          # descarta enquestes més velles
  min_sample: 300
  sample_weight: sqrt       # pes addicional = sqrt(mostra / 1000)
