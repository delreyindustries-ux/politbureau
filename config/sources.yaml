  # ======================================================================
  # FORA D'ESPANYA — nomes eina local (pb.ps1 serve), NO a politbureau.es.
  # La publicacio fa `--country ES` i aquestes entrades no hi entren.
  # Restaurades el 02/10/2026 a peticio de l'Alfonso.
  # ======================================================================

  # ---------- FRANÇA ----------
  - id: fr-pres-2027
    country: FR
    label: "França — Presidencials 2027 (1a volta)"
    scope: national
    page: "Opinion_polling_for_the_2027_French_presidential_election"
    # Es vota una persona: el mapa i el resum mostren el CANDIDAT, no el partit.
    # Els de l'estimacio surten de les enquestes (el mes preguntat de cada linia
    # als ultims 90 dies); els del 2022, del fitxer oficial de resultats.
    display: candidates
    pub: {es: francia, ca: franca, name_es: Francia, name_ca: França}
    # Intencio de vot per departament (03/11/2026): swing proporcional de la
    # mitjana d'avui sobre la primera volta del 2022 (web/fr/, geo/france.py).
    departments: {geo: "fr/departements.json", base: "fr/presidentielle-2022.json"}
    baseline:
      election: "presidentielle-2022-t1"
      date: "2022-04-10"
      candidates:
        ENS: "Emmanuel Macron"
        RN: "Marine Le Pen"
        LFI: "Jean-Luc Mélenchon"
        REC: "Éric Zemmour"
        LR: "Valérie Pécresse"
        EELV: "Yannick Jadot"
        PCF: "Fabien Roussel"
        PS: "Anne Hidalgo"
        OTHER: "Altres candidats"   # Lassalle, Dupont-Aignan, Poutou i Arthaud

  # ---------- ITÀLIA ----------
  - id: it-general
    country: IT
    label: "Itàlia — Generals (Camera)"
    scope: national
    page: "Opinion_polling_for_the_next_Italian_general_election"
    baseline: {election: "politiche-2022", date: "2022-09-25"}
    pub: {es: italia, ca: italia, name_es: Italia, name_ca: Itàlia}
    # Intencio de vot per regio (03/11/2026): swing sobre les generals del 2022
    # (geo/subnational.py, web/it/). La Vall d'Aosta te un sistema propi: en gris.
    departments: {geo: "it/regioni.json", base: "it/politiche-2022.json", units_es: regiones,
                  units_ca: regions, base_es: "las generales de 2022", base_ca: "les generals del 2022"}
    chamber:
      name: "Camera dei Deputati"
      seats: 400
      method: proportional
      threshold: 0.03
      note_es: "La ley electoral italiana (el Rosatellum) elige un 37% de los diputados en distritos uninominales, que suelen premiar a las coaliciones, y eso aquí no se modela."
      note_ca: "La llei electoral italiana (el Rosatellum) tria un 37% dels diputats en districtes uninominals, que acostumen a premiar les coalicions, i això aquí no es modela."
      # Avis honest: el Rosatellum reparteix un 37% dels escons en districtes
      # uninominals, i aixo no es modela. El grafic dona l'ordre de magnitud,
      # no l'escon exacte, i ho ha de dir a la pantalla.

  # ---------- ESTATS UNITS: midterms 2026, estat per estat ----------
  # Sense resultat de base: als EUA les enquestes ja son per estat, aixi que el
  # mapa nomes pinta els estats que tenen enquestes. Un estat sense enquestes
  # queda en blanc en lloc de rebre un color inventat.
  - id: us-senate-2026
    country: US
    label: "EUA — Senat 2026 per estat"
    scope: state
    page: "2026_United_States_Senate_elections"
    # El patro original perdia Ohio i Florida: son ELECCIONS ESPECIALS (les
    # dimissions de Vance i Rubio) i la pagina es diu "Senate special election
    # in ...". Comprovat el 02/10/2026: el patro original en trobava 33 de 35.
    discover:
      pattern: "^2026_United_States_Senate_(?:special_)?election_in_(.+)$"
    chamber:
      name: "Senat dels Estats Units"
      seats: 100
      in_play: 35                  # 33 ordinaris (classe 2) + 2 especials (Ohio, Florida)
      method: fptp_state
      partial: true

  - id: us-gov-2026
    country: US
    label: "EUA — Governadors 2026 per estat"
    scope: state
    page: "2026_United_States_gubernatorial_elections"
    # Exclou els vicegovernadors: el patro original els agafava i rascava deu
    # pagines de mes. Queden 39 = 36 estats + 3 territoris.
    discover:
      pattern: "^2026_(?!.*lieutenant)(.+)_gubernatorial_election$"
    optional: true

  # ---------- RESTA D'EUROPA (des del 03/11/2026) ----------
  # Demanat per l'Alfonso: UE + resta d'Europa occidental i Balcans, legislatives
  # i presidencials. Nomes la mitjana estatal a la web (pagines.abroad_*), sense
  # mapa. Els partits NO son al cataleg: es desen amb codi provisional ("?...")
  # i la web en mostra el nom de la capcalera i el color que hi posa Wikipedia.
  # `group: europa` hi afegeix les seccions i exclusions de runner.EUROPA_*.
  # `pub`: adreca i nom a la web.
  # Belgica (03/11/2026): nomes per regions, `national: false` i `regions:` mes avall.
  # Fora, a 03/11/2026: Xipre, Letonia, Malta, Serbia i Bosnia (acaben de votar i encara
  # no hi ha pagina de la propera), Suissa, Macedonia del Nord, Albania i
  # Kosovo (sense taula d'enquestes), i totes les presidencials: o s'acaben de
  # fer, o les enquestes de la propera son escenaris amb candidats hipotetics
  # (Txequia 2028). Quan n'hi hagi, s'afegeixen com eu-cz.
  - {id: eu-at, group: europa, country: AT, scope: national, label: "Àustria — Consell Nacional",
     page: "Next Austrian legislative election", pub: {es: austria, ca: austria, name_es: Austria, name_ca: Àustria},
     departments: {geo: "at/units.json", base: "at/base.json", units_es: "estados federados",
