# Cambres dels parlaments estrangers per als escons orientatius (04/11/2026).
#
# Un repartiment ESTATAL amb la mitjana de les enquestes, el llindar real i el
# metode real del pais. Es un ordre de magnitud: on la llei reparteix per
# circumscripcions (`districts: true`) els partits petits hi surten afavorits.
# Escons, llindars i metodes: seccio "Electoral system" de l'article de
# Wikipedia de l'ultima eleccio de cada pais (consultada el 04/11/2026).
#
# `seats`: els que es reparteixen; `total`: la cambra sencera (la majoria es
# calcula sobre aquesta) quan hi ha escons que no es modelen (minories,
# exterior, Feroe i Groenlandia).
#
# Sense escons: sistemes majoritaris o mixtos (Regne Unit, Franca, Canada,
# Australia, Japo, Hongria, Lituania, Mexic, Tailandia), vot unic transferible
# (Irlanda) i Belgica (sense mitjana estatal).

