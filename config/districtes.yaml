# Noms dels districtes municipals, nomes on s'han pogut COMPROVAR (19/10/2026).
# Els fitxers d'Interior i de l'INE nomes porten el numero del districte censal.
# Per a cada ciutat es va agafar la llista oficial de districtes i un lloc conegut
# de cadascun (Puerta del Sol, Camp Nou, Mestalla, Catedral de Sevilla...), i es
# va mirar en quin districte censal cau amb els contorns de data/seccions. Nomes
# s'accepta una ciutat si cada lloc cau en un districte diferent i no en queda cap
# sense nom. Bilbao i Malaga no van passar la prova (els districtes censals no
# coincideixen amb els administratius) i es queden amb el numero.
# A les quatre ciutats d'aqui la numeracio censal resulta ser l'oficial.
