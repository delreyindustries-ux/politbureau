  OTHER:  {name: "Autres",          color: "#9E9E9E", aliases: [others, autres, "other"]}

IT:
  FDI:    {name: "FdI",             color: "#0F4C81", aliases: [fdi, "fratelli d'italia", "fratelli ditalia", "brothers of italy"]}
  PD:     {name: "PD",              color: "#EF3E3E", aliases: [pd, "partito democratico", "democratic party (italy)", "democratic party"]}
  M5S:    {name: "M5S",             color: "#FFEB3B", aliases: [m5s, "movimento 5 stelle", "five star movement"]}
  LEGA:   {name: "Lega",            color: "#009EE0", aliases: [lega, "lega nord", ln]}
  FI:     {name: "Forza Italia",    color: "#0088CE", aliases: [fi, "forza italia"]}
  AVS:    {name: "AVS",             color: "#DE7C00", aliases: [avs, "alleanza verdi e sinistra", "verdi-si", "greens and left alliance"]}
  AZ:     {name: "Azione",          color: "#A0CFEB", aliases: [az, azione, action, "action (italian political party)", "action - italia viva", "action – italia viva"]}
  IV:     {name: "Italia Viva",     color: "#E5007D", aliases: [iv, "italia viva"]}
  SVP:    {name: "SVP (Sudtirol)",  color: "#00A651", aliases: [svp, "sudtiroler volkspartei", "svp - patt"]}
  NM:     {name: "Noi Moderati",    color: "#4FA3D1", aliases: [nm, "noi moderati", "us moderates"]}
  # Futuro Nazionale: extrema dreta, fundat el febrer del 2026 per Roberto
  # Vannacci en sortir de la Lega. Sense resultat del 2022: el model li dona la
  # seva quota estatal a tot arreu, com a qualsevol partit nou.
  FN:     {name: "Futuro Nazionale", color: "#8B6F47", aliases: [fn, fnv, "futuro nazionale", "national future"]}
  # Partito Liberale Democratico: liberal, de centre. Tambe nou.
  PLD:    {name: "PLD",             color: "#5DA9E9", aliases: [pld, "partito liberale democratico", "liberal democratic party (italy)", "liberal democratic party"]}
  ITX:    {name: "Italexit",        color: "#5E4B8B", aliases: [italexit, "italexit per l'italia"]}
  UP:     {name: "Unione Popolare", color: "#B5175A", aliases: ["unione popolare", "people's union (italy)", "people's union"]}
  ISP:    {name: "Italia Sovrana",  color: "#7A6A55", aliases: ["italia sovrana e popolare", "sovereign and popular italy"]}
  SCN:    {name: "Sud chiama Nord", color: "#E08A2E", aliases: ["sud chiama nord", "south calls north"]}
  PIU:    {name: "+Europa",         color: "#FFD700", aliases: ["+eu", "+europa", pe, "more europe"]}
  OTHER:  {name: "Altri",           color: "#9E9E9E", aliases: [others, altri, "other", "freedom (electoral list)", "popular alternative", "peace land dignity", "sovereign popular democracy", "united states of europe (electoral list)"]}

US:
