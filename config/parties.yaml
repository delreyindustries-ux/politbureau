# Diccionari canonic de partits d'Espanya.
# `aliases` = com apareix la columna a les taules de Wikipedia i a les sigles
# del Ministeri (minuscules, sense accents).
# Els colors son valors per defecte editables: el mapa i els grafics els llegeixen d'aqui.

ES:
  PSOE:
    name: PSOE
    color: '#E30613'
    aliases:
