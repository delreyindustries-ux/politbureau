  SUMAR:
    name: Sumar
    color: '#E01B4C'
    # Frente Amplio es la marca electoral amb que IU, Movimiento Sumar, Mes
    # Madrid i Catalunya en Comu es presentaran a les generals del 2027: els
    # mateixos quatre que el 2023 anaven dins de Sumar. Per tant la seva base
    # real es la de Sumar, i han de resoldre al MATEIX codi. Si no, el dia que
    # una casa publiqui "Frente Amplio" entraria com a partit nou sense cap
    # resultat del 2023 al darrere, perdriem la continuitat de la serie i el
    # model li aplicaria el tracte dels partits sense base.
    # Compte: Podemos NO hi es, i ja va a part amb codi propi.
    aliases:
    - sumar
    - smr
    - sumar-iu
    - movimiento sumar
    - frente amplio
    - un paso al frente
  PODEMOS:
    name: Podemos
    color: '#683064'
